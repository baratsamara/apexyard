version: 1

projects:
  - name: theAunties
    repo: baratsamara/theAunties
    workspace: workspace/theAunties
    docs: projects/theAunties
    status: active
    tier: P0
    roles:
      - tech-lead
      - frontend-engineer
      - backend-engineer
      - qa-engineer
    tags:
      - customer-facing
      - revenue
    ticket_prefix: ""

  - name: alfrouting
    repo: baratsamara/alfrouting
    workspace: workspace/alfrouting
    docs: projects/alfrouting
    status: handover
    tier: P1
    roles:
      - tech-lead
      - backend-engineer
      - frontend-engineer
      - qa-engineer
    tags:
      - internal
      - sandbox
    ticket_prefix: ""

  - name: alfqc
    repo: baratsamara/alfQc
    workspace: workspace/alfqc/alfQc
    docs: projects/alfqc
    status: handover
    tier: P1
    roles:
      - tech-lead
      - backend-engineer
      - frontend-engineer
      - qa-engineer
    tags:
      - internal
      - sandbox
    ticket_prefix: ""

# ----------------------------------------------------------------------------
# Defaults
# ----------------------------------------------------------------------------
defaults:
  status: active
  tier: P1
  ticket_prefix: ""
